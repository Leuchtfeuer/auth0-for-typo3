services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Leuchtfeuer\Auth0\:
    resource: '../Classes/*'

  Leuchtfeuer\Auth0\Domain\Repository\ApplicationRepository:
    public: true

  # Public only so the deprecated static ApplicationFactory::build() shim can
  # resolve the service through GeneralUtility::makeInstance(). Drop together
  # with the shim in v15.
  Leuchtfeuer\Auth0\Factory\ApplicationFactory:
    public: true

  Leuchtfeuer\Auth0\Domain\Repository\UserRepositoryFactory:
    public: true

  Leuchtfeuer\Auth0\Service\AuthenticationService:
    public: true
